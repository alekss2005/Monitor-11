<title>Мониторинг — Киев</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #panel {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(0,0,0,0.92); color: #fff;
    padding: 10px 14px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0));
    font-size: 14px; line-height: 1.4;
    max-height: 60vh; overflow: hidden;
    border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
    transition: transform 0.3s ease, max-height 0.3s ease;
    box-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  #panel.collapsed { transform: translateY(calc(-100% + 44px + env(safe-area-inset-top, 0))); max-height: none; }
  #panel.collapsed .tabs, #panel.collapsed #list { display: none; }
  #panel .header { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 32px; }
  #panel .title { font-weight: 700; color: #ffcc00; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #panel .btn { background: rgba(255,255,255,0.22); color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent; transition: background 0.15s; }
  #panel .btn:active { background: rgba(255,255,255,0.4); }
  #panel .btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #panel .meta { font-size: 11px; color: #bbb; margin-top: 4px; }
  #panel .tabs { display: flex; gap: 6px; margin-top: 8px; }
  #panel .tab { flex: 1; padding: 7px 6px; border-radius: 8px; font-size: 12px; background: rgba(255,255,255,0.12); color: #eee; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
  #panel .tab.active { background: #0088cc; color: #fff; font-weight: 600; }
  #list { margin-top: 10px; max-height: calc(60vh - 140px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .row { display: flex; align-items: flex-start; gap: 8px; margin-top: 6px; font-size: 13px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; box-shadow: 0 0 6px currentColor; }
  .row-text { flex: 1; word-wrap: break-word; }
  .row-title { font-weight: 700; }
  .row-sub { color: #eee; font-size: 12px; }
  .target-icon { display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
  .target-icon svg { display: block; }
  .target-icon .label { font-size: 11px; font-weight: 800; text-align: center; white-space: nowrap; margin-top: -2px; color: #fff !important; text-shadow: 0 0 4px #000, 0 0 4px #000, 0 0 4px #000; -webkit-text-stroke: 0.5px #000; }
  .event-icon { display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
  .event-icon .emoji { font-size: 24px; line-height: 1; filter: drop-shadow(0 0 5px rgba(0,0,0,1)) drop-shadow(0 0 2px #fff); }
  .event-icon.archived .emoji { opacity: 0.5; filter: grayscale(0.8); }
  .event-icon .label { font-size: 10px; font-weight: 800; text-align: center; white-space: nowrap; margin-top: -2px; color: #fff !important; text-shadow: 0 0 4px #000, 0 0 4px #000, 0 0 4px #000; -webkit-text-stroke: 0.5px #000; }
  .leaflet-popup-content-wrapper { border-radius: 12px; background: #1a1a1a; color: #fff; }
  .leaflet-popup-tip { background: #1a1a1a; }
  .leaflet-popup-close-button { color: #fff !important; }
  .history-popup { font-size: 12px; max-height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch; color: #fff; }
  .history-popup .entry { border-bottom: 1px solid #333; padding: 7px 0; }

  .history-popup .time { color: #aaa; font-size: 11px; }
  .history-popup .route { color: #fff; font-weight: 700; margin-top: 2px; }

    ballistic: { label: 'Баллистика', speedKmh: 1500, color: '#c04fff',

                 words: ['реактивн'] },
    unknown:   { label: 'НЛО',        speedKmh: 200,  color: '#00e5ff', words: [] },
};

function detectCategory(text) {
    if (!text) return 'unknown';
    const lower = text.toLowerCase();
    const hasJet   = lower.includes('реактивн');
    const hasDrone = ['шахед','герань','гербера','shahed','geran'].some(w => lower.includes(w));
    if (hasJet && hasDrone) return 'jet_drone';
    if (hasJet) return 'jet_drone';
    for (const key of ['ballistic','cruise','drone']) {
        for (const w of CATEGORIES[key].words) if (lower.includes(w)) return key;
    }
    return 'unknown';
}

                 words: ['вибух','взрыв','детонація'] },

function detectEventTypes(text) {
    if (!text) return [];
    const lower = text.toLowerCase();
    const types = [];
    for (const [key, def] of Object.entries(EVENT_TYPES)) {
        for (const w of def.words) if (lower.includes(w)) { types.push(key); break; }
    }
    return types;
}

function normalizeName(s) {
    return String(s).toLowerCase()
        .replace(/[ʼ'`']/g, '')
        .replace(/ё/g, 'е')
        .replace(/ґ/g, 'г')
        .replace(/i/g, 'і');
}

const STEM_ENDINGS = [

];
const STEM_MIN_WORD = 6, STEM_MIN_STEM = 4;
const STEM_STOPWORDS = new Set([
    'район','районі','району','районе','райони','районів',
    'масив','масиві','масиву','місто','місті','міста',

    'києва','києві','києву','київ','киев','киеве','киева','киеву',
]);
function stemWord(w) {
    if (!w || w.length < STEM_MIN_WORD) return w;
    for (const e of STEM_ENDINGS) {
        if (w.endsWith(e) && w.length - e.length >= STEM_MIN_STEM) return w.slice(0, w.length - e.length);
    }
    return w;
}

// ============ ПОСТРОЕНИЕ ИНДЕКСОВ ============
const LOCATION_INDEX = {};
const STEM_CANDIDATES = {};
const STEM_INDEX = {};
const REGEX_PLACES = [];

function indexLocation(label, lat, lng, aliases) {
    const coords = { lat, lng, label };
    const keys = [label, ...(aliases || [])];
    for (const raw of keys) {
        if (!raw) continue;
        const nk = normalizeName(raw);
        if (!nk) continue;
        if (!LOCATION_INDEX[nk]) LOCATION_INDEX[nk] = coords;
        for (const w of nk.split(/\s+/)) {
            if (w.length < STEM_MIN_WORD) continue;
            if (STEM_STOPWORDS.has(w)) continue;
            const st = stemWord(w);
            if (st.length < STEM_MIN_STEM) continue;
            if (!STEM_CANDIDATES[st]) STEM_CANDIDATES[st] = [];
            if (!STEM_CANDIDATES[st].includes(coords)) STEM_CANDIDATES[st].push(coords);
        }
    }
}

for (const b of KYIV_BRIDGES)            indexLocation(b.name, b.lat, b.lng, b.aliases);
for (const p of KYIV_LOCATIONS)          indexLocation(p.name, p.lat, p.lng, p.aliases);
for (const d of KYIV_DISTRICTS)          indexLocation(d.name, d.lat, d.lng, d.aliases);
for (const p of KYIV_SUBURBS)            indexLocation(p.name, p.lat, p.lng, p.aliases);
for (const e of ENERGY_DB)               indexLocation(e.name, e.lat, e.lng, e.aliases);
for (const o of INFRASTRUCTURE_OBJECTS)  indexLocation(o.name, o.lat, o.lng, o.aliases);
for (const o of INCIDENT_OBJECTS)        indexLocation(o.name, o.lat, o.lng, []);
for (const s of KYIV_SUBSTATIONS)        indexLocation(s[0], s[1], s[2], []);
for (const r of KYIV_OBLAST_SETTLEMENTS) indexLocation(r[0], r[1], r[2], []);
for (const [k, v] of Object.entries(PLACES_OLD)) indexLocation(v[2], v[0], v[1], [k]);
for (const [st, arr] of Object.entries(STEM_CANDIDATES)) if (arr.length === 1) STEM_INDEX[st] = arr[0];
for (const [pat, [lat, lng, label]] of Object.entries(EXTRA_PLACES)) {
    try { REGEX_PLACES.push({ re: new RegExp(pat, 'i'), lat, lng, label }); } catch (e) {}
}

// ============ УТИЛИТЫ ============
function escapeRegex(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTime(iso) {
    try {
        return new Date(iso).toLocaleString('ru-RU', {
            timeZone: TIMEZONE,
            day: '2-digit', month: '2-digit',
            hour: '2-digit', minute: '2-digit',
        }).replace(',', '');
    } catch (e) { return iso; }
}
function formatHHMMSS(d) {
    try {
        return d.toLocaleTimeString('ru-RU', { timeZone: TIMEZONE, hour12: false });
    } catch (e) { return d.toISOString().slice(11,19); }
}
function showStatus(text, ms = 3000, isError = false) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.classList.toggle('err', isError);
    el.classList.add('show');
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => el.classList.remove('show'), ms);
}
function distanceKm(a, b) {
    const R = 6371;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;
    const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
    const x = Math.sin(dLat/2)**2 + Math.sin(dLng/2)**2 * Math.cos(la1) * Math.cos(la2);
    return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(from, to) {
    const φ1 = from.lat * Math.PI / 180, φ2 = to.lat * Math.PI / 180;
    const Δλ = (to.lng - from.lng) * Math.PI / 180;
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

// ============ ПОИСК ЛОКАЦИЙ ============
function findPlaces(text) {
    if (!text) return [];
    const norm = normalizeName(text);
    const found = [];
    const usedLabels = new Set();

    const exactKeys = Object.keys(LOCATION_INDEX).sort((a,b) => b.length - a.length);
    for (const key of exactKeys) {
        const coords = LOCATION_INDEX[key];
        if (usedLabels.has(coords.label)) continue;
        const re = new RegExp(`(^|[^а-яіїєґa-z])${escapeRegex(key)}([^а-яіїєґa-z]|$)`, 'i');
        const m = re.exec(norm);
        if (m) {
            usedLabels.add(coords.label);
            found.push({ lat: coords.lat, lng: coords.lng, label: coords.label, matchType: 'exact', _pos: m.index });
        }
    }

    const stemmedText = norm.replace(/[а-яіїєґa-z]+/gi, w => stemWord(w));
    const stemKeys = Object.keys(STEM_INDEX).sort((a,b) => b.length - a.length);
    for (const st of stemKeys) {
        const coords = STEM_INDEX[st];
        if (usedLabels.has(coords.label)) continue;
        const re = new RegExp(`(^|[^а-яіїєґa-z])${escapeRegex(st)}([^а-яіїєґa-z]|$)`, 'i');
        const m = re.exec(stemmedText);
        if (m) {
            usedLabels.add(coords.label);
            found.push({ lat: coords.lat, lng: coords.lng, label: coords.label, matchType: 'stem', _pos: m.index });
        }
    }

    for (const rp of REGEX_PLACES) {
        if (usedLabels.has(rp.label)) continue;
        const m = rp.re.exec(norm);
        if (m) {
            usedLabels.add(rp.label);
            found.push({ lat: rp.lat, lng: rp.lng, label: rp.label, matchType: 'regex', _pos: m.index });
        }
    }

    if (found.length === 0) {
        for (const reg of REGIONS) {
            const m = reg.re.exec(norm);
            if (m) {
                usedLabels.add(reg.name);
                found.push({ lat: reg.lat, lng: reg.lng, label: reg.name, matchType: 'region', _pos: m.index });
                break;
            }
        }
    }

    found.sort((a, b) => (a._pos || 0) - (b._pos || 0));
    const result = [];
    for (const p of found) {
        let dup = false;
        for (const r of result) if (distanceKm(p, r) < DEDUP_DISTANCE_KM) { dup = true; break; }
        if (!dup) result.push(p);
    }
    return result;
}

// ============ ПАРСЕР ЦЕЛЕЙ ============
const DRONE_ID_RE = /(?<![\p{L}\p{N}])(герань|шахед|shahed|geran|гербера)[\s\-–—]*(\d{1,4})(?!\p{N})/iu;

function extractDroneId(text) {
    if (!text) return null;
    const m = text.match(DRONE_ID_RE);
    if (m) {
        const base = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
        return `${base}-${m[2]}`;
    }
    return null;
}

// РАСШИРЕННЫЙ набор — 5 паттернов
const MOVEMENT_PATTERNS = [
    // 1. «с X на Y»
    /(?:^|\s)(?:з|із|из|с|от|від)\s+[^,.!?]{2,60}?\s+(?:на|до|в|у|по|через)\s+/i,
    // 2. Глаголы движения
    /(?:курсом|прямує|прямують|летить|летять|рухається|рухаються|йде|йдуть|направляється|направляються|трима[єю]ть?\s+курс|взяв\s+курс|у\s+напрямку|в\s+напрямку|рушив|рушили|вилетів|вилетіли|заходить|заходять|зайшов|зайшли|вийшов|вийшли|наближається|наближаються|просувається|просуваються|залітає|залітають|пройшов|пройшли|входить|входять|увійшов|увійшли)\s+(?:на|до|в|у|по|через|над)\s+/i,
    // 3. «Шахед на Київ»
    /(?:шахед|шахеди|герань|гербера|бпла|дрон|дрони|ракет[аиуы]|крилат[аоі]|баліст[иі]к[аиу]|ціль|цілі|група|групи)\s+(?:на|до|в|у|по|через|над)\s+/i,
    // 4. Короткие «курс на X», «рух на X»
    /(?:курс|рух|напрямок|напрям)\s+[^,.!?]{0,25}?(?:на|до|в|у)\s+/i,
    // 5. «над X», «через X» + локация (для транзитных целей)
    /(?:летить|пролітає|пролітають|рухається)\s+над\s+/i,
];

function hasMovement(text) {
    if (!text) return false;
    const norm = normalizeName(text);
    return MOVEMENT_PATTERNS.some(re => re.test(norm));
}

function parseTarget(text) {
    if (!text) return null;
    const norm = normalizeName(text);
    if (!hasMovement(norm)) return null;
    const places = findPlaces(text);
    if (places.length === 0) return null;

    let fromPoint = null, toPoint = null;
    const mFromTo = norm.match(/(?:^|\s)(?:з|із|из|с|от|від)\s+([^,.!?]{2,40}?)\s+(?:на|до|в|у|по|через)\s+([^,.!?]{2,40})/);
    if (mFromTo) {
        const fromText = mFromTo[1], toText = mFromTo[2];
        for (const p of places) {
            const lbl = normalizeName(p.label);
            if (!fromPoint && fromText.includes(lbl)) fromPoint = p;
            if (!toPoint   && toText.includes(lbl))   toPoint   = p;
        }
    }

    let route = [], routeConfidence = 'low';
    if (fromPoint && toPoint && fromPoint.label !== toPoint.label) {
        route = [fromPoint, toPoint]; routeConfidence = 'high';
    } else if (places.length === 1) {
        route = [places[0]]; routeConfidence = 'medium';
    } else if (places.length > 1) {
        route = places.slice(0, 3); routeConfidence = 'low';
    } else return null;

    return {
        category: detectCategory(text),
        explicitId: extractDroneId(text),
        route, fromPoint, routeConfidence,
        sourceText: text,
    };
}

// ============ ПАРСЕР СОБЫТИЙ ============
function parseEvents(text) {
    if (!text) return [];
    const rawParts = text.split(/[▪️•●·\n;]+/).map(s => s.trim()).filter(s => s.length > 3);
    const events = [];
    for (const part of rawParts) {
        const types = detectEventTypes(part);
        if (types.length === 0) continue;
        const places = findPlaces(part);
        if (places.length === 0) continue;
        const place = places[0];
        for (const type of types) {
            events.push({ type, lat: place.lat, lng: place.lng, place: place.label, sourceText: part });
        }
    }
    return events;
}

// ============ ЗАГРУЗКА ============
async function fetchChannelHtml(channel) {
    const target = `https://t.me/s/${channel}`;
    let lastErr = null;
    for (let i = 0; i < CORS_PROXIES.length; i++) {
        try {
            const url = CORS_PROXIES[i](target);
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
            const r = await fetch(url, { signal: controller.signal });
            clearTimeout(timeout);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            let text = await r.text();
            // allorigins/get возвращает JSON {contents: "..."}
            if (text.trim().startsWith('{')) {
                try { const j = JSON.parse(text); if (j.contents) text = j.contents; } catch (e) {}
            }
            if (!text || text.length < 500) throw new Error('Пустой ответ');
            if (!text.includes('tgme_widget_message')) throw new Error('Не HTML канала');
            return text;
        } catch (e) { lastErr = e; }
    }
    throw new Error('Все прокси недоступны: ' + (lastErr ? lastErr.message : '?'));
}

function parseChannelMessages(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const posts = doc.querySelectorAll('.tgme_widget_message_wrap');
    const messages = [];
    posts.forEach((post, i) => {
        if (i < posts.length - MESSAGES_TO_SCAN) return;
        const textEl = post.querySelector('.tgme_widget_message_text');
        const timeEl = post.querySelector('.tgme_widget_message_date time');
        const text = textEl ? textEl.innerText.trim() : '';
        const time = timeEl ? timeEl.getAttribute('datetime') : null;
        if (text) messages.push({ text, time });
    });
    return messages;
}

// ============ СОСТОЯНИЕ ============
let state = {
    targets: {}, events: [], lastPoll: null, lastError: null,
    counters: {}, activeTab: 'targets',
    lastSeenTime: {},   // channel -> ISO время последнего обработанного сообщения
    lastChannelOk: 0,   // сколько каналов удалось в последнем цикле
};
let history = {};

function loadState() {
    try {
        const raw = localStorage.getItem('monitor_v10');
        if (raw) state = Object.assign(state, JSON.parse(raw));
        if (!state.targets)      state.targets = {};
        if (!state.events)       state.events = [];
        if (!state.counters)     state.counters = {};
        if (!state.lastSeenTime) state.lastSeenTime = {};
    } catch (e) {}
}
function saveState() { try { localStorage.setItem('monitor_v10', JSON.stringify(state)); } catch (e) {} }
function loadHistory() {
    try { const raw = localStorage.getItem('monitor_history_v10'); if (raw) history = JSON.parse(raw); }
    catch (e) { history = {}; }
}
function saveHistory() { try { localStorage.setItem('monitor_history_v10', JSON.stringify(history)); } catch (e) {} }
function appendHistory(id, entry) {
    if (!history[id]) history[id] = [];
    history[id].push(entry);
    if (history[id].length > HISTORY_LIMIT) history[id] = history[id].slice(-HISTORY_LIMIT);
    saveHistory();
}
function pruneTargets() {
    const now = Date.now();
    let changed = false;
    for (const [id, t] of Object.entries(state.targets)) {
        if (now - new Date(t.timestamp).getTime() > TARGET_RESET_MS) { delete state.targets[id]; changed = true; }
    }
    if (changed) saveState();
}
function pruneEvents() {
    const now = Date.now();
    const before = state.events.length;
    state.events = state.events.filter(ev => now - new Date(ev.timestamp).getTime() < EVENT_TTL_MS);
    if (state.events.length !== before) saveState();
}
function isEventActive(ev) {
    return Date.now() - new Date(ev.timestamp).getTime() < EVENT_ACTIVE_MS;
}
function findTargetToMerge(route, category, fromPoint, timestamp) {
    const now = new Date(timestamp).getTime();
    if (fromPoint) {
        for (const [id, t] of Object.entries(state.targets)) {
            if (t.category !== category) continue;
            const last = t.route[t.route.length - 1];
            if (distanceKm(last, fromPoint) < 1.5) return id;
        }
    }
    let best = null, bestDist = Infinity;
    for (const [id, t] of Object.entries(state.targets)) {
        if (t.category !== category) continue;
        if (now - new Date(t.timestamp).getTime() > MERGE_WINDOW_MS) continue;
        const last = t.route[t.route.length - 1];
        const d = distanceKm(last, route[0]);
        if (d < MERGE_RADIUS_KM && d < bestDist) { best = id; bestDist = d; }
    }
    return best;
}
function nextId(prefix) {
    state.counters[prefix] = (state.counters[prefix] || 0) + 1;
    return `${prefix}-${state.counters[prefix]}`;
}
function eventKey(ev) {
    const lat = ev.lat.toFixed(3), lng = ev.lng.toFixed(3);
    const min = Math.floor(new Date(ev.timestamp).getTime() / 60000);
    const txt = (ev.sourceText || '').slice(0, 40).replace(/\s+/g, ' ');
    return `${ev.type}|${lat}|${lng}|${min}|${txt}`;
}
function addEvent(ev, timestamp, channel) {
    const key = eventKey({ ...ev, timestamp });
    for (const existing of state.events) if (eventKey(existing) === key) return;
    state.events.push({ ...ev, timestamp, channel, id: nextId('ev') });
}

// ============ ОБРАБОТКА СООБЩЕНИЙ ============
function processMessages(messages, channel) {
    if (!messages || messages.length === 0) return;
    const lastSeen = state.lastSeenTime[channel] || null;
    // От старых к новым, но пропускаем уже обработанные
    let newestTime = lastSeen;
    for (let i = messages.length - 1; i >= 0; i--) {
        const msg = messages[i];
        const timestamp = msg.time || new Date().toISOString();
        if (lastSeen && msg.time && msg.time <= lastSeen) continue;
        if (!newestTime || (msg.time && msg.time > newestTime)) newestTime = msg.time;

        const target = parseTarget(msg.text);
        if (target) {
            let targetId = target.explicitId;
            let existing = targetId ? state.targets[targetId] : null;
            if (!existing) {
                const mergedId = findTargetToMerge(target.route, target.category, target.fromPoint, timestamp);
                if (mergedId) { targetId = mergedId; existing = state.targets[mergedId]; }
            }
            if (!targetId) targetId = nextId(target.category);

            let newRoute;
            if (existing && existing.route.length > 0) {
                const lastOld = existing.route[existing.route.length - 1];
                if (distanceKm(lastOld, target.route[0]) < 1.5) newRoute = [...existing.route, ...target.route.slice(1)];
                else newRoute = [...existing.route, ...target.route];
            } else newRoute = [...target.route];

            const unchanged = existing && existing.timestamp === timestamp && existing.route.length === newRoute.length;
            if (!unchanged) {
                state.targets[targetId] = {
                    id: targetId, category: target.category,
                    explicitId: target.explicitId || null,
                    route: newRoute, timestamp,
                    routeConfidence: target.routeConfidence,
                    sourceText: target.sourceText, channel,
                };
                appendHistory(targetId, {
                    timestamp, category: target.category,
                    route: newRoute, sourceText: target.sourceText, channel,
                });
            }
        }

        for (const ev of parseEvents(msg.text)) addEvent(ev, timestamp, channel);
    }
    if (newestTime && newestTime !== lastSeen) {
        state.lastSeenTime[channel] = newestTime;
    }
}

// ============ ОСНОВНОЙ ЦИКЛ ============
let isPolling = false;
async function pollAllChannels(manual = false) {
    if (isPolling) { if (manual) showStatus('Уже обновляется...'); return; }
    isPolling = true;
    if (manual) showStatus('Обновление...', 2000);

    const allChannels = [...PRIORITY_CHANNELS, ...CHANNELS];
    const queue = allChannels.slice();
    let fetchedCount = 0, lastErr = null;

    const workers = Array.from({ length: PARALLEL_WORKERS }, async () => {
        while (queue.length) {
            const channel = queue.shift();
            try {
                const html = await fetchChannelHtml(channel);
                const messages = parseChannelMessages(html);
                processMessages(messages, channel);
                fetchedCount++;
            } catch (e) { lastErr = e.message; }
        }
    });
    await Promise.all(workers);

    if (fetchedCount > 0) {
        state.lastPoll = new Date().toISOString();
        state.lastError = null;
    } else {
        state.lastError = lastErr || 'Нет данных';
    }
    state.lastChannelOk = fetchedCount;
    saveState();
    pruneTargets();
    pruneEvents();
    renderAll();
    updateMeta();
    if (manual) {
        if (fetchedCount > 0) showStatus(`✅ Обновлено (${fetchedCount}/${allChannels.length})`);
        else showStatus('⚠️ Ни одного канала не удалось прочитать', 4000, true);
    }
    isPolling = false;
}

function updateMeta() {
    const meta = document.getElementById('panelMeta');
    if (state.lastError && !state.lastPoll) {
        meta.textContent = '⚠️ ' + state.lastError;
        meta.style.color = '#ff8888';
        return;
    }
    if (!state.lastPoll) {
        meta.textContent = 'Обновляется…';
        meta.style.color = '#bbb';
        return;
    }
    const d = new Date(state.lastPoll);
    const hhmmss = formatHHMMSS(d);
    const age = Date.now() - d.getTime();
    if (age > 120_000) {
        meta.textContent = `⚠️ Данные устарели (последнее обновление ${hhmmss})`;
        meta.style.color = '#ffaa44';
    } else {
        const chOk = state.lastChannelOk || 0;
        const chTotal = PRIORITY_CHANNELS.length + CHANNELS.length;
        meta.textContent = `Обновлено: ${hhmmss} · каналов ${chOk}/${chTotal}`;
        meta.style.color = '#bbb';
    }
}

// ============ КАРТА ============
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([50.4501, 30.5234], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

function colorFor(cat) { return (CATEGORIES[cat] || CATEGORIES.unknown).color; }

function makeTargetSvg(category, color) {
    if (category === 'drone')
        return `<svg width="34" height="34" viewBox="0 0 34 34"><polygon points="17,2 26,26 17,20 8,26" fill="${color}" stroke="#000" stroke-width="1.5"/></svg>`;
    if (category === 'jet_drone')
        return `<svg width="34" height="34" viewBox="0 0 34 34"><polygon points="17,2 26,26 17,20 8,26" fill="${color}" stroke="#000" stroke-width="1.5"/><circle cx="17" cy="14" r="2.2" fill="#fff" stroke="#000" stroke-width="0.5"/></svg>`;
    if (category === 'cruise')
        return `<svg width="34" height="34" viewBox="0 0 34 34"><polygon points="17,2 22,12 32,16 22,20 17,32 12,20 2,16 12,12" fill="${color}" stroke="#000" stroke-width="1.5"/></svg>`;
    if (category === 'ballistic')
        return `<svg width="34" height="34" viewBox="0 0 34 34"><polygon points="17,2 25,22 17,18 9,22" fill="${color}" stroke="#000" stroke-width="1.5"/><rect x="15" y="22" width="4" height="8" fill="${color}"/></svg>`;
    return `<svg width="28" height="28" viewBox="0 0 28 28"><ellipse cx="14" cy="16" rx="13" ry="4.8" fill="${color}" stroke="#000" stroke-width="1"/><ellipse cx="14" cy="12.5" rx="7" ry="4" fill="${color}" stroke="#000" stroke-width="1" opacity="0.9"/><circle cx="7.5" cy="16" r="1.4" fill="#fff" stroke="#000" stroke-width="0.3"/><circle cx="14" cy="17" r="1.4" fill="#fff" stroke="#000" stroke-width="0.3"/><circle cx="20.5" cy="16" r="1.4" fill="#fff" stroke="#000" stroke-width="0.3"/></svg>`;
}

function makeTargetIcon(id, category, confidence) {
    const color = colorFor(category);
    const cat = CATEGORIES[category] || CATEGORIES.unknown;
    const confMark = confidence === 'low' ? ' ~' : '';
    if (category === 'unknown') {
        return L.divIcon({
            className: 'target-icon',
            html:
                `<div style="position:relative;width:28px;height:38px;">` +
                    `<div class="arrow-wrap" style="position:absolute;left:50%;top:-10px;transform:translateX(-50%) rotate(0deg);transform-origin:50% 100%;will-change:transform;">` +
                        `<svg width="14" height="22" viewBox="0 0 14 22"><polygon points="7,0 13,14 9.5,14 9.5,22 4.5,22 4.5,14 1,14" fill="${color}" stroke="#000" stroke-width="1"/></svg>` +
                    `</div>` +
                    `<div class="svg-wrap" style="position:absolute;left:0;bottom:0;">${makeTargetSvg(category, color)}</div>` +
                `</div>` +
                `<div class="label">${escapeHtml(id)}${confMark}</div>`,
            iconSize: [50, 64], iconAnchor: [25, 50]
        });
    }
    return L.divIcon({
        className: 'target-icon',
        html:
            `<div class="svg-wrap" style="transform: rotate(0deg); transform-origin: 50% 50%; will-change: transform;">${makeTargetSvg(category, color)}</div>` +
            `<div class="label">${escapeHtml(id)}${confMark}<span style="font-size:9px;opacity:.9"> · ${cat.label}</span></div>`,
        iconSize: [60, 56], iconAnchor: [30, 28]
    });
}

function makeEventIcon(type, active) {
    const def = EVENT_TYPES[type] || EVENT_TYPES.impact;
    return L.divIcon({
        className: 'event-icon' + (active ? '' : ' archived'),
        html: `<div class="emoji">${def.emoji}</div><div class="label">${def.label}</div>`,
        iconSize: [44, 44], iconAnchor: [22, 32]
    });
}

function setIconRotation(marker, angleDeg) {
    if (!marker || !marker.getElement) return;
    const el = marker.getElement(); if (!el) return;
    const wrap = el.querySelector('.svg-wrap');
    if (wrap) wrap.style.transform = `rotate(${angleDeg}deg)`;
}
function setArrowRotation(marker, angleDeg) {
    if (!marker || !marker.getElement) return;
    const el = marker.getElement(); if (!el) return;
    const wrap = el.querySelector('.arrow-wrap');
    if (wrap) wrap.style.transform = `translateX(-50%) rotate(${angleDeg}deg)`;
}
function updateIconAngle(route, marker, category) {
    if (!marker || !route || route.length < 2) {
        if (category === 'unknown') setArrowRotation(marker, 0);
        else setIconRotation(marker, 0);
        return;
    }
    const from = route[route.length - 2], to = route[route.length - 1];
    const angle = bearing(from, to);
    if (category === 'unknown') setArrowRotation(marker, angle);
    else setIconRotation(marker, angle);
}

const activeTargets = {}, activeEvents = {};

function openTargetHistory(id, latlng) {
    const items = (history[id] || []).slice().reverse();
    let html = '<div class="history-popup">';
    html += '<div style="font-weight:700;margin-bottom:6px">📜 ' + escapeHtml(id) + '</div>';
    if (items.length === 0) html += '<div class="empty">История пуста</div>';
    else {
        for (const h of items) {
            const cat = (CATEGORIES[h.category] || CATEGORIES.unknown).label;
            const route = (h.route || []).map(p => escapeHtml(p.label)).join(' → ');
            const src = h.sourceText ? escapeHtml(h.sourceText.slice(0, 140)) : '';
            html += `<div class="entry"><div class="time">${formatTime(h.timestamp)} · ${cat}</div><div class="route">${route}</div>` +
                    (src ? `<div class="src">«${src}»</div>` : '') + '</div>';
        }
    }
    html += '</div>';
    L.popup({ maxWidth: 320, minWidth: 260, autoPan: true }).setLatLng(latlng).setContent(html).openOn(map);
}
function openEventPopup(ev, latlng) {
    const def = EVENT_TYPES[ev.type] || EVENT_TYPES.impact;
    const html =
        `<div class="history-popup">` +
        `<div style="font-weight:700;margin-bottom:6px;color:${def.color}">${def.emoji} ${def.label}</div>` +
        `<div class="time">${formatTime(ev.timestamp)} · ${escapeHtml(ev.place || '')}</div>` +
        `<div class="src">«${escapeHtml(ev.sourceText || '')}»</div>` +
        `</div>`;
    L.popup({ maxWidth: 300, minWidth: 240, autoPan: true }).setLatLng(latlng).setContent(html).openOn(map);
}

function renderTarget(t) {
    const existing = activeTargets[t.id];
    if (existing && existing.lastTimestamp === t.timestamp && existing.lastRouteLength === t.route.length) return;
    if (existing) {
        if (existing.marker)   map.removeLayer(existing.marker);
        if (existing.polyline) map.removeLayer(existing.polyline);
        if (existing.arrow)    map.removeLayer(existing.arrow);
        if (existing.angleTimer) clearInterval(existing.angleTimer);
        delete activeTargets[t.id];
    }
    const points = t.route;
    if (!points || points.length === 0) return;

    const color = colorFor(t.category);
    const cat = CATEGORIES[t.category] || CATEGORIES.unknown;
    const icon = makeTargetIcon(t.id, t.category, t.routeConfidence);
    const lastPoint = points[points.length - 1];
    const lastLatLng = [lastPoint.lat, lastPoint.lng];

    let marker;
    if (points.length === 1 || t.category === 'unknown') {
        marker = L.marker(lastLatLng, { icon, zIndexOffset: 1000 }).addTo(map);
    } else {
        const latlngs = points.map(p => [p.lat, p.lng]);
        try {
            marker = L.markerMotion(latlngs, cat.speedKmh, { icon, rotation: false, autoplay: true, loop: false }).addTo(map);
        } catch (e) {
            marker = L.marker(lastLatLng, { icon, zIndexOffset: 1000 }).addTo(map);
        }
    }
    marker.on('click', () => openTargetHistory(t.id, marker.getLatLng()));
    setTimeout(() => updateIconAngle(points, marker, t.category), 30);
    if (marker.on) marker.on('motion.end', () => updateIconAngle(points, marker, t.category));
    const angleTimer = setInterval(() => {
        if (!map.hasLayer(marker)) { clearInterval(angleTimer); return; }
        updateIconAngle(points, marker, t.category);
    }, 400);

    let polyline = null;
    if (points.length > 1 && t.category !== 'unknown') {
        const latlngs = points.map(p => [p.lat, p.lng]);
        polyline = L.polyline(latlngs, {
            color: '#ff2d2d', weight: 1.5,
            dashArray: t.routeConfidence === 'low' ? '2,10' : '4,8',
            opacity:   t.routeConfidence === 'low' ? 0.55 : 0.9,
            interactive: false,
        }).addTo(map);
    }

    let arrowMarker = null;
    if (points.length > 1) {
        const prevPoint = points[points.length - 2];
        const angle = bearing(prevPoint, lastPoint);
        const arrowIcon = L.divIcon({
            className: 'route-arrow',
            html: `<div style="transform:rotate(${angle}deg);transform-origin:50% 50%;"><svg width="20" height="20" viewBox="0 0 20 20"><polygon points="10,0 16,16 10,12 4,16" fill="${color}" stroke="#000" stroke-width="1"/></svg></div>`,
            iconSize: [20, 20], iconAnchor: [10, 10],
        });
        arrowMarker = L.marker(lastLatLng, { icon: arrowIcon, interactive: false, zIndexOffset: 999 }).addTo(map);
    }

    activeTargets[t.id] = { marker, polyline, arrow: arrowMarker, lastTimestamp: t.timestamp, lastRouteLength: points.length, angleTimer };

    if (Object.keys(activeTargets).length === 1) {
        try {
            if (polyline) map.fitBounds(polyline.getBounds(), { padding: [60, 60] });
            else map.setView(lastLatLng, 12);
        } catch (e) {}
    }
}

function renderEvent(ev, forceShow) {
    const active = isEventActive(ev);
    if (!active && !forceShow) {
        if (activeEvents[ev.id]) { map.removeLayer(activeEvents[ev.id]); delete activeEvents[ev.id]; }
        return;
    }
    if (activeEvents[ev.id]) return;
    const icon = makeEventIcon(ev.type, active);
    const m = L.marker([ev.lat, ev.lng], { icon, opacity: active ? 1 : 0.6, zIndexOffset: active ? 500 : 0 }).addTo(map);
    m.on('click', () => openEventPopup(ev, m.getLatLng()));
    activeEvents[ev.id] = m;
}

function removeStaleTargets(currentIds) {
    for (const id of Object.keys(activeTargets)) {
        if (!currentIds.includes(id)) {
            const t = activeTargets[id];
            if (t.marker)   map.removeLayer(t.marker);
            if (t.polyline) map.removeLayer(t.polyline);
            if (t.arrow)    map.removeLayer(t.arrow);
            if (t.angleTimer) clearInterval(t.angleTimer);
            delete activeTargets[id];
        }
    }
}

function renderAll() {
    const targets = Object.values(state.targets);
    removeStaleTargets(targets.map(t => t.id));
    for (const t of targets) renderTarget(t);
    const forceShowArchive = state.activeTab === 'archive';
    const evIds = new Set();
    for (const ev of state.events) {
        const active = isEventActive(ev);
        if (active || forceShowArchive) { renderEvent(ev, forceShowArchive); evIds.add(ev.id); }
    }
    for (const id of Object.keys(activeEvents)) {
        if (!evIds.has(id)) { map.removeLayer(activeEvents[id]); delete activeEvents[id]; }
    }
    updatePanel();
}

function updatePanel() {
    const title = document.getElementById('panelTitle');
    const list = document.getElementById('list');
    const tab = state.activeTab;
    if (tab === 'targets') {
        const targets = Object.values(state.targets);
        title.textContent = targets.length ? `🎯 Цели: ${targets.length}` : '🎯 Нет активных целей';
        list.innerHTML = targets.map(t => {
            const color = colorFor(t.category);
            const catLabel = (CATEGORIES[t.category] || CATEGORIES.unknown).label;
            const routeStr = (t.route || []).map(p => escapeHtml(p.label)).join(' → ');
            const conf = t.routeConfidence === 'low' ? ' ~' : '';
            return `<div class="row"><span class="dot" style="background:${color};color:${color}"></span>
                <div class="row-text"><div class="row-title" style="color:${color}">${escapeHtml(t.id)}${conf} <span style="font-size:10px;opacity:.75;color:#fff">${catLabel}</span></div>
                <div class="row-sub">${routeStr}</div></div></div>`;
        }).join('');
    } else if (tab === 'events') {
        const events = state.events.filter(isEventActive);
        title.textContent = events.length ? `💥 События: ${events.length}` : '💥 Нет активных событий';
        list.innerHTML = events.slice().reverse().map(ev => {
            const def = EVENT_TYPES[ev.type] || EVENT_TYPES.impact;
            return `<div class="row"><span class="dot" style="background:${def.color};color:${def.color}"></span>
                <div class="row-text"><div class="row-title" style="color:${def.color}">${def.emoji} ${def.label}</div>
                <div class="row-sub">${escapeHtml(ev.place || '')} · ${formatTime(ev.timestamp)}</div></div></div>`;
        }).join('');
    } else {
        const archived = state.events.filter(ev => !isEventActive(ev));
        title.textContent = `📦 Архив: ${archived.length}`;
        list.innerHTML = archived.slice().reverse().map(ev => {
            const def = EVENT_TYPES[ev.type] || EVENT_TYPES.impact;
            return `<div class="row"><span class="dot" style="background:#666"></span>
                <div class="row-text"><div class="row-title" style="color:#ccc">${def.emoji} ${def.label}</div>
                <div class="row-sub">${escapeHtml(ev.place || '')} · ${formatTime(ev.timestamp)}</div></div></div>`;
        }).join('');
    }
}

// ============ UI ============
const panel = document.getElementById('panel');
const toggleBtn = document.getElementById('toggleBtn');
const refreshBtn = document.getElementById('refreshBtn');

toggleBtn.addEventListener('click', () => {
    const collapsed = panel.classList.toggle('collapsed');
    toggleBtn.textContent = collapsed ? 'Открыть' : 'Свернуть';
});

refreshBtn.addEventListener('click', () => {
    refreshBtn.classList.add('spinning');
    pollAllChannels(true).finally(() => {
        setTimeout(() => refreshBtn.classList.remove('spinning'), 600);
    });
});

document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    state.activeTab = btn.dataset.tab;
    saveState();
    renderAll();
});

// ============ СТАРТ ============
loadState();
loadHistory();
renderAll();
updateMeta();
pollAllChannels(false);
setInterval(() => pollAllChannels(false), POLL_INTERVAL_MS);
setInterval(() => { pruneTargets(); pruneEvents(); renderAll(); updateMeta(); }, 60_000);
showStatus('Загрузка данных...');

// Отладка
window.__debugPlaces = (text) => findPlaces(text);
window.__debugTarget = (text) => parseTarget(text);
window.__state       = () => state;
</script>
